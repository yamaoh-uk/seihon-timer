<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="投入タイマー">
<meta name="theme-color" content="#1d6ef5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>製本メトロノーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f2f4f7;
    --white: #ffffff;
    --border: #e2e6ed;
    --text: #0f1623;
    --muted: #8691a4;
    --pill: #ebeef3;
    --blue: #1d6ef5;
    --blue-bg: #e8f0fe;
    --red: #e53935;
    --shadow: 0 2px 10px rgba(0,0,0,0.07);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { height: 100%; overscroll-behavior: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    padding-top: calc(var(--safe-top) + 12px);
    padding-bottom: calc(var(--safe-bottom) + 20px);
    padding-left: 14px;
    padding-right: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overscroll-behavior-y: none;
    -webkit-overflow-scrolling: touch;
  }

  /* ── トップバー ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 6px;
  }
  .top-bar h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  /* ── ヒーロー（メトロノーム表示） ── */
  .hero {
    background: var(--blue);
    border-radius: 22px;
    padding: 26px 20px 24px;
    box-shadow: 0 6px 20px rgba(29,110,245,0.28);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    text-align: center;
  }
  .hero::before {
    content: '';
    position: absolute;
    bottom: -50px; right: -30px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    pointer-events: none;
  }
  .hero.pulse { animation: heroPulse 0.16s ease; }
  @keyframes heroPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .hero-eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .hero-num {
    font-family: 'DM Mono', monospace;
    font-size: 96px;
    font-weight: 500;
    color: #fff;
    line-height: 1;
    letter-spacing: -5px;
  }
  .hero-unit {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.65);
    margin-top: 8px;
  }
  .hero-unit strong { color: rgba(255,255,255,0.9); font-weight: 600; }

  /* ── スタート/ストップ ボタン ── */
  .big-btn {
    width: 100%;
    height: 84px;
    border: none;
    border-radius: 20px;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: var(--shadow);
    transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn.start { background: var(--blue); box-shadow: 0 6px 18px rgba(29,110,245,0.32); }
  .big-btn.stop { background: var(--red); box-shadow: 0 6px 18px rgba(229,57,53,0.32); }

  /* ── カード共通 ── */
  .card {
    background: var(--white);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-head {
    padding: 13px 16px 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  /* 設定行 */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .setting-row:last-of-type { border-bottom: none; }
  .sr-text { flex: 1; min-width: 0; }
  .sr-label { font-size: 15px; font-weight: 600; }
  .sr-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ステッパー */
  .stepper {
    display: flex;
    align-items: center;
    background: var(--pill);
    border-radius: 14px;
    padding: 4px;
    flex-shrink: 0;
  }
  .sp-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    user-select: none;
    transition: background 0.1s;
  }
  .sp-btn:active { background: var(--border); }
  .sp-mid { min-width: 58px; text-align: center; padding: 0 2px; }
  .sp-val {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    display: block;
    line-height: 1.1;
  }
  .sp-unit { font-size: 10px; color: var(--muted); font-weight: 500; display: block; }

  /* 停止パターン */
  .stop-item { padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .stop-item:last-of-type { border-bottom: none; }
  .si-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .si-name { font-size: 14px; font-weight: 600; }
  .si-del {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--pill);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .si-del:active { background: #fde8e8; color: var(--red); border-color: var(--red); }
  .si-body { display: flex; align-items: center; gap: 8px; }
  .si-sep { font-size: 13px; color: var(--muted); font-weight: 500; white-space: nowrap; }

  /* 追加ボタン */
  .add-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: calc(100% - 32px);
    margin: 12px 16px 14px;
    height: 48px;
    border-radius: 12px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s;
  }
  .add-btn:active { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

  /* インストール案内 */
  .install-banner {
    background: var(--white);
    border-radius: 14px;
    border: 1.5px solid var(--blue-bg);
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .install-banner .ib-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
  .install-banner .ib-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .install-banner .ib-text strong { color: var(--blue); font-weight: 600; }
  .install-banner .ib-close {
    margin-left: auto; flex-shrink: 0;
    width: 24px; height: 24px;
    border: none; background: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }

  .spacer { height: 4px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>製本メトロノーム</h1>
</div>

<!-- インストール案内（初回のみ） -->
<div class="install-banner" id="install-banner" style="display:none">
  <span class="ib-icon">📲</span>
  <div class="ib-text">
    <strong>ホーム画面に追加するとアプリとして使えます</strong><br>
    Safari → 共有ボタン →「ホーム画面に追加」
  </div>
  <button class="ib-close" onclick="dismissBanner()">✕</button>
</div>

<!-- メトロノーム表示 -->
<div class="hero" id="metro-hero">
  <div class="hero-eyebrow" id="metro-status">待機中</div>
  <div class="hero-num" id="metro-count">0</div>
  <div class="hero-unit">冊 <strong id="metro-interval-label">投入間隔 8秒</strong></div>
</div>

<!-- スタート/ストップ -->
<button class="big-btn start" id="toggle-btn" onclick="toggleMetro()">スタート</button>

<!-- 投入間隔設定 -->
<div class="card">
  <div class="card-head">投入間隔設定</div>
  <div class="setting-row">
    <div class="sr-text">
      <div class="sr-label">投入間隔</div>
      <div class="sr-sub">ビープ音が鳴る間隔</div>
    </div>
    <div class="stepper">
      <button class="sp-btn" onclick="adjCycle(-1)">−</button>
      <div class="sp-mid">
        <span class="sp-val" id="cycle-val">8</span>
        <span class="sp-unit">秒 / 冊</span>
      </div>
      <button class="sp-btn" onclick="adjCycle(+1)">+</button>
    </div>
  </div>
</div>

<!-- 停止パターン -->
<div class="card">
  <div class="card-head">停止パターン</div>
  <div id="stop-list"></div>
  <button class="add-btn" onclick="addStop()">＋ 停止パターンを追加</button>
</div>

<div class="spacer"></div>

<script>
  // ── 状態 ──
  let state = { cycle: 8, stops: [] };

  // ── ローカルストレージから復元 ──
  function loadState() {
    try {
      const saved = localStorage.getItem('seihon-state');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.cycle = parsed.cycle || 8;
        state.stops = (parsed.stops || []).map(s => ({ ...s, id: s.id || Date.now() + Math.random() }));
      }
    } catch(e) {}
    if (state.stops.length === 0) addStop(30, 50);
  }

  function saveState() {
    try { localStorage.setItem('seihon-state', JSON.stringify(state)); } catch(e) {}
  }

  // ── インストール案内（スタンドアロンでなければ表示） ──
  function checkInstall() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    const dismissed = localStorage.getItem('banner-dismissed');
    if (!isStandalone && !dismissed) {
      document.getElementById('install-banner').style.display = 'flex';
    }
  }
  function dismissBanner() {
    document.getElementById('install-banner').style.display = 'none';
    localStorage.setItem('banner-dismissed', '1');
  }

  // ── 投入間隔ステッパー ──
  function adjCycle(d) {
    state.cycle = Math.max(1, Math.min(120, state.cycle + d));
    document.getElementById('cycle-val').textContent = state.cycle;
    document.getElementById('metro-interval-label').textContent = `投入間隔 ${state.cycle}秒`;
    saveState();
  }

  // ── 停止パターン ──
  function addStop(sec=30, every=50) {
    state.stops.push({ id: Date.now() + Math.floor(Math.random()*1000), sec, every });
    renderStops(); saveState();
  }

  function removeStop(id) {
    state.stops = state.stops.filter(s => s.id !== id);
    renderStops(); saveState();
  }

  function adjStop(id, field, d) {
    const s = state.stops.find(s => s.id === id);
    if (!s) return;
    if (field === 'sec')   s.sec   = Math.max(1, Math.min(600, s.sec + d));
    if (field === 'every') s.every = Math.max(1, Math.min(999, s.every + d));
    document.getElementById(`sv-${id}-${field}`).textContent = s[field];
    saveState();
  }

  function renderStops() {
    const list = document.getElementById('stop-list');
    list.innerHTML = '';
    state.stops.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'stop-item';
      el.innerHTML = `
        <div class="si-head">
          <span class="si-name">停止パターン ${i + 1}</span>
          <button class="si-del" onclick="removeStop(${s.id})">✕</button>
        </div>
        <div class="si-body">
          <div class="stepper">
            <button class="sp-btn" onclick="adjStop(${s.id},'sec',-5)">−</button>
            <div class="sp-mid">
              <span class="sp-val" id="sv-${s.id}-sec">${s.sec}</span>
              <span class="sp-unit">秒停止</span>
            </div>
            <button class="sp-btn" onclick="adjStop(${s.id},'sec',+5)">+</button>
          </div>
          <span class="si-sep">を</span>
          <div class="stepper">
            <button class="sp-btn" onclick="adjStop(${s.id},'every',-5)">−</button>
            <div class="sp-mid">
              <span class="sp-val" id="sv-${s.id}-every">${s.every}</span>
              <span class="sp-unit">冊ごと</span>
            </div>
            <button class="sp-btn" onclick="adjStop(${s.id},'every',+5)">+</button>
          </div>
        </div>`;
      list.appendChild(el);
    });
  }

  // ── ビープ音（Web Audio API） ──
  let audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.13);
    } catch(e) {}
  }

  // ── 画面スリープ防止（稼働中に画面が消えないように） ──
  let wakeLock = null;
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  function releaseWakeLock() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (metro.running && document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });

  // ── メトロノーム本体 ──
  const metro = {
    running: false,
    count: 0,
    phase: 'idle',        // 'running' | 'stopping'
    nextThresholds: [],
    timerId: null,
    countdownId: null,
    phaseEndTime: 0,
  };

  function pulse() {
    const hero = document.getElementById('metro-hero');
    hero.classList.remove('pulse');
    void hero.offsetWidth;
    hero.classList.add('pulse');
  }

  function updateMetroUI() {
    document.getElementById('metro-count').textContent = metro.count;
    const statusEl = document.getElementById('metro-status');
    if (!metro.running) {
      statusEl.textContent = '待機中';
    } else if (metro.phase === 'stopping') {
      const remain = Math.max(0, Math.ceil((metro.phaseEndTime - Date.now()) / 1000));
      statusEl.textContent = `停止中（あと${remain}秒）`;
    } else {
      statusEl.textContent = '稼働中';
    }
  }

  function scheduleNextTick(delayMs) {
    metro.timerId = setTimeout(tick, delayMs);
  }

  function tick() {
    if (!metro.running) return;
    beep();
    pulse();
    metro.count++;
    updateMetroUI();

    let stopDuration = 0;
    state.stops.forEach((s, i) => {
      if (metro.count >= metro.nextThresholds[i]) {
        stopDuration += s.sec;
        metro.nextThresholds[i] += s.every;
      }
    });

    if (stopDuration > 0) {
      metro.phase = 'stopping';
      metro.phaseEndTime = Date.now() + stopDuration * 1000;
      updateMetroUI();
      clearInterval(metro.countdownId);
      metro.countdownId = setInterval(updateMetroUI, 250);
      metro.timerId = setTimeout(() => {
        clearInterval(metro.countdownId);
        if (!metro.running) return;
        metro.phase = 'running';
        updateMetroUI();
        scheduleNextTick(state.cycle * 1000);
      }, stopDuration * 1000);
    } else {
      metro.phase = 'running';
      scheduleNextTick(state.cycle * 1000);
    }
  }

  function startMetro() {
    metro.running = true;
    metro.count = 0;
    metro.phase = 'running';
    metro.nextThresholds = state.stops.map(s => s.every);
    requestWakeLock();
    tick();
  }

  function stopMetro() {
    metro.running = false;
    metro.phase = 'idle';
    clearTimeout(metro.timerId);
    clearInterval(metro.countdownId);
    releaseWakeLock();
    updateMetroUI();
  }

  function toggleMetro() {
    const btn = document.getElementById('toggle-btn');
    if (metro.running) {
      stopMetro();
      btn.textContent = 'スタート';
      btn.classList.remove('stop');
      btn.classList.add('start');
    } else {
      startMetro();
      btn.textContent = 'ストップ';
      btn.classList.remove('start');
      btn.classList.add('stop');
    }
  }

  // ── 画面反映（復元後） ──
  function syncUI() {
    document.getElementById('cycle-val').textContent = state.cycle;
    document.getElementById('metro-interval-label').textContent = `投入間隔 ${state.cycle}秒`;
    renderStops();
    updateMetroUI();
  }

  // ── Service Worker 登録 ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // ── 起動 ──
  loadState();
  syncUI();
  checkInstall();
</script>
</body>
</html>
