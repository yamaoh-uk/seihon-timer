<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="製本タイマー">
<meta name="theme-color" content="#1d6ef5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>製本タイマー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f2f4f7;
    --white: #ffffff;
    --border: #e2e6ed;
    --text: #0f1623;
    --muted: #8691a4;
    --pill: #ebeef3;
    --blue: #1d6ef5;
    --blue-bg: #e8f0fe;
    --red: #e53935;
    --shadow: 0 2px 10px rgba(0,0,0,0.07);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { height: 100%; overscroll-behavior: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    padding-top: calc(var(--safe-top) + 12px);
    padding-bottom: calc(var(--safe-bottom) + 20px);
    padding-left: 14px;
    padding-right: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overscroll-behavior-y: none;
    -webkit-overflow-scrolling: touch;
  }

  /* ── トップバー ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 6px;
  }
  .top-bar h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  /* ── メインタブ ── */
  .tab-bar {
    display: flex;
    background: var(--pill);
    border-radius: 14px;
    padding: 4px;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: var(--white); color: var(--blue); box-shadow: var(--shadow); }
  .tab-panel { display: none; flex-direction: column; gap: 10px; }
  .tab-panel.active { display: flex; }

  /* ── ヒーロー（理論生産数） ── */
  .hero {
    background: var(--blue);
    border-radius: 22px;
    padding: 26px 20px 24px;
    box-shadow: 0 6px 20px rgba(29,110,245,0.28);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    text-align: center;
  }
  .hero::before {
    content: '';
    position: absolute;
    bottom: -50px; right: -30px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    pointer-events: none;
  }
  .hero.pulse { animation: heroPulse 0.16s ease; }
  @keyframes heroPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .hero-eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .hero-num {
    font-family: 'DM Mono', monospace;
    font-size: 96px;
    font-weight: 500;
    color: #fff;
    line-height: 1;
    letter-spacing: -5px;
  }
  .hero-unit {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.65);
    margin-top: 8px;
  }
  .hero-unit strong { color: rgba(255,255,255,0.9); font-weight: 600; }
  .hero-status {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.16);
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ── カード共通 ── */
  .card {
    background: var(--white);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-head {
    padding: 13px 16px 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  /* 既成サイズボタン */
  .size-preset-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
    transition: opacity 0.15s;
  }
  .size-preset-row.disabled { opacity: 0.4; pointer-events: none; }
  .size-btn {
    flex: 1;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--pill);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .size-btn:active { background: var(--border); }
  .size-btn.selected { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

  /* 本の仕様入力 */
  .spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px 16px 16px;
  }
  .spec-field { display: flex; flex-direction: column; gap: 4px; }
  .spec-field label { font-size: 11px; color: var(--muted); font-weight: 600; }
  .spec-field input {
    height: 46px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--pill);
    padding: 0 12px;
    font-size: 16px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    color: var(--text);
    transition: opacity 0.15s;
  }
  .spec-field input:focus { outline: 2px solid var(--blue); background: var(--white); }
  .spec-field.disabled input { opacity: 0.5; pointer-events: none; }

  /* 設定行 */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    gap: 10px;
  }
  .sr-text { flex: 1; min-width: 0; }
  .sr-label { font-size: 15px; font-weight: 600; }
  .sr-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ステッパー */
  .stepper {
    display: flex;
    align-items: center;
    background: var(--pill);
    border-radius: 14px;
    padding: 4px;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .stepper.disabled { opacity: 0.4; pointer-events: none; }
  .sp-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    user-select: none;
    transition: background 0.1s;
  }
  .sp-btn:active { background: var(--border); }
  .sp-mid { min-width: 58px; text-align: center; padding: 0 2px; }
  .sp-val {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    display: block;
    line-height: 1.1;
  }
  .sp-unit { font-size: 10px; color: var(--muted); font-weight: 500; display: block; }

  /* 音の設定 */
  .sound-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    touch-action: manipulation;
  }
  .sound-option:last-child { border-bottom: none; }
  .so-label { font-size: 14px; font-weight: 600; }
  .so-radio {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .sound-option.selected .so-radio { border-color: var(--blue); }
  .sound-option.selected .so-radio::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--blue);
  }

  /* ── スタート/ストップ ボタン ── */
  .big-btn {
    width: 100%;
    height: 84px;
    border: none;
    border-radius: 20px;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: var(--shadow);
    transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn:disabled { opacity: 0.5; pointer-events: none; }
  .big-btn.start { background: var(--blue); box-shadow: 0 6px 18px rgba(29,110,245,0.32); }
  .big-btn.stop { background: var(--red); box-shadow: 0 6px 18px rgba(229,57,53,0.32); }

  /* ── 履歴タブ ── */
  .view-toggle {
    display: flex;
    background: var(--pill);
    border-radius: 12px;
    padding: 3px;
    flex-shrink: 0;
  }
  .view-btn {
    flex: 1;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    touch-action: manipulation;
  }
  .view-btn.active { background: var(--white); color: var(--blue); box-shadow: var(--shadow); }

  .group-head {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-bg);
  }
  .group-sub { font-size: 10px; color: var(--muted); font-weight: 500; margin-top: 1px; }

  .rec-card { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .rec-card:last-child { border-bottom: none; }
  .rec-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rec-time { font-size: 13px; font-weight: 700; }
  .rec-date { font-size: 11px; color: var(--muted); }
  .rec-spec { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .rec-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px 12px;
    margin-top: 8px;
  }
  .rec-item { font-size: 12px; color: var(--muted); }
  .rec-item b { color: var(--text); font-weight: 600; font-family: 'DM Mono', monospace; }

  .empty-state, .loading-state {
    padding: 40px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  /* インストール案内 */
  .install-banner {
    background: var(--white);
    border-radius: 14px;
    border: 1.5px solid var(--blue-bg);
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .install-banner .ib-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
  .install-banner .ib-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .install-banner .ib-text strong { color: var(--blue); font-weight: 600; }
  .install-banner .ib-close {
    margin-left: auto; flex-shrink: 0;
    width: 24px; height: 24px;
    border: none; background: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }

  .spacer { height: 4px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>製本タイマー</h1>
</div>

<!-- インストール案内（初回のみ） -->
<div class="install-banner" id="install-banner" style="display:none">
  <span class="ib-icon">📲</span>
  <div class="ib-text">
    <strong>ホーム画面に追加するとアプリとして使えます</strong><br>
    Safari → 共有ボタン →「ホーム画面に追加」
  </div>
  <button class="ib-close" onclick="dismissBanner()">✕</button>
</div>

<!-- メインタブ -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-btn-measure" onclick="switchTab('measure')">計測</button>
  <button class="tab-btn" id="tab-btn-history" onclick="switchTab('history')">履歴</button>
</div>

<!-- ══════════ 計測タブ ══════════ -->
<div class="tab-panel active" id="tab-measure">

  <!-- 理論生産数 -->
  <div class="hero" id="metro-hero">
    <div class="hero-eyebrow">理論生産数</div>
    <div class="hero-num" id="res-main">450</div>
    <div class="hero-unit">冊 <strong>/ 1時間</strong></div>
    <div class="hero-status" id="metro-status">待機中</div>
  </div>

  <!-- 本の仕様 -->
  <div class="card">
    <div class="card-head">本の仕様</div>
    <div class="size-preset-row" id="size-preset-row">
      <button class="size-btn" id="size-btn-A4" onclick="selectSizePreset('A4')">A4</button>
      <button class="size-btn" id="size-btn-A5" onclick="selectSizePreset('A5')">A5</button>
      <button class="size-btn" id="size-btn-B5" onclick="selectSizePreset('B5')">B5</button>
      <button class="size-btn" id="size-btn-B6" onclick="selectSizePreset('B6')">B6</button>
    </div>
    <div class="spec-grid" id="spec-grid">
      <div class="spec-field" id="field-height">
        <label>縦 (mm)</label>
        <input type="number" inputmode="decimal" id="spec-height" placeholder="0" oninput="onSpecInput()">
      </div>
      <div class="spec-field" id="field-width">
        <label>横 (mm)</label>
        <input type="number" inputmode="decimal" id="spec-width" placeholder="0" oninput="onSpecInput()">
      </div>
      <div class="spec-field" id="field-thickness">
        <label>厚み (mm)</label>
        <input type="number" inputmode="decimal" id="spec-thickness" placeholder="0" oninput="onSpecInput()">
      </div>
      <div class="spec-field" id="field-count">
        <label>冊数</label>
        <input type="number" inputmode="numeric" id="spec-count" placeholder="0" oninput="onSpecInput()">
      </div>
    </div>
  </div>

  <!-- 投入間隔設定 -->
  <div class="card">
    <div class="card-head">投入間隔設定</div>
    <div class="setting-row">
      <div class="sr-text">
        <div class="sr-label">投入間隔</div>
        <div class="sr-sub">ビープ音が鳴る間隔</div>
      </div>
      <div class="stepper" id="cycle-stepper">
        <button class="sp-btn" onclick="adjCycle(-1)">−</button>
        <div class="sp-mid">
          <span class="sp-val" id="cycle-val">8</span>
          <span class="sp-unit">秒 / 冊</span>
        </div>
        <button class="sp-btn" onclick="adjCycle(+1)">+</button>
      </div>
    </div>
  </div>

  <!-- 音の設定 -->
  <div class="card">
    <div class="card-head">音の設定</div>
    <div id="sound-list"></div>
  </div>

  <!-- スタート/ストップ -->
  <button class="big-btn start" id="toggle-btn" onclick="toggleMetro()">スタート</button>

</div>

<!-- ══════════ 履歴タブ ══════════ -->
<div class="tab-panel" id="tab-history">

  <div class="view-toggle">
    <button class="view-btn active" id="view-btn-date" onclick="switchHistoryView('date')">日付別</button>
    <button class="view-btn" id="view-btn-spec" onclick="switchHistoryView('spec')">仕様別（速度比較）</button>
  </div>

  <div class="card" id="history-container">
    <div class="loading-state">読み込み中…</div>
  </div>

</div>

<div class="spacer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAiLRhNSUcaB6X2lWpPYxBoCKti9a9-JMc",
    authDomain: "yamao-zaiko.firebaseapp.com",
    projectId: "yamao-zaiko",
    storageBucket: "yamao-zaiko.firebasestorage.app",
    messagingSenderId: "336996135723",
    appId: "1:336996135723:web:e7e6ff5ff33fb88eaa0b6e",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  try { enableIndexedDbPersistence(db); } catch (e) {}

  // ── 状態 ──
  let state = { cycle: 8, specHeight: '', specWidth: '', specThickness: '', specCount: '', soundType: 'pip' };

  function loadState() {
    try {
      const saved = localStorage.getItem('seihon-state');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.cycle = parsed.cycle || 8;
        state.specHeight = parsed.specHeight ?? '';
        state.specWidth = parsed.specWidth ?? '';
        state.specThickness = parsed.specThickness ?? '';
        state.specCount = parsed.specCount ?? '';
        state.soundType = SOUNDS[parsed.soundType] ? parsed.soundType : 'pip';
      }
    } catch(e) {}
  }
  function saveState() {
    try { localStorage.setItem('seihon-state', JSON.stringify(state)); } catch(e) {}
  }

  // ── インストール案内 ──
  function checkInstall() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    const dismissed = localStorage.getItem('banner-dismissed');
    if (!isStandalone && !dismissed) {
      document.getElementById('install-banner').style.display = 'flex';
    }
  }
  window.dismissBanner = function() {
    document.getElementById('install-banner').style.display = 'none';
    localStorage.setItem('banner-dismissed', '1');
  };

  // ── メインタブ切替 ──
  window.switchTab = function(name) {
    document.getElementById('tab-measure').classList.toggle('active', name === 'measure');
    document.getElementById('tab-history').classList.toggle('active', name === 'history');
    document.getElementById('tab-btn-measure').classList.toggle('active', name === 'measure');
    document.getElementById('tab-btn-history').classList.toggle('active', name === 'history');
  };

  // ── 本の仕様入力 ──
  function onSpecInput() {
    state.specHeight = document.getElementById('spec-height').value;
    state.specWidth = document.getElementById('spec-width').value;
    state.specThickness = document.getElementById('spec-thickness').value;
    state.specCount = document.getElementById('spec-count').value;
    renderSizePresets();
    saveState();
  }
  window.onSpecInput = onSpecInput;

  function syncSpecInputs() {
    document.getElementById('spec-height').value = state.specHeight;
    document.getElementById('spec-width').value = state.specWidth;
    document.getElementById('spec-thickness').value = state.specThickness;
    document.getElementById('spec-count').value = state.specCount;
  }

  function setSpecDisabled(disabled) {
    ['field-height','field-width','field-thickness','field-count'].forEach(id => {
      document.getElementById(id).classList.toggle('disabled', disabled);
    });
    document.getElementById('size-preset-row').classList.toggle('disabled', disabled);
  }

  // ── 既成サイズ（A4・A5・B5・B6） ──
  const SIZE_PRESETS = {
    A4: { height: 297, width: 210 },
    A5: { height: 210, width: 148 },
    B5: { height: 257, width: 182 },
    B6: { height: 182, width: 128 },
  };

  window.selectSizePreset = function(key) {
    const p = SIZE_PRESETS[key];
    if (!p) return;
    state.specHeight = String(p.height);
    state.specWidth = String(p.width);
    syncSpecInputs();
    renderSizePresets();
    saveState();
  };

  function renderSizePresets() {
    const h = parseFloat(state.specHeight), w = parseFloat(state.specWidth);
    Object.entries(SIZE_PRESETS).forEach(([key, p]) => {
      document.getElementById('size-btn-' + key).classList.toggle('selected', h === p.height && w === p.width);
    });
  }

  // ── 理論生産数 ──
  function calcProduction() {
    document.getElementById('res-main').textContent = Math.round(3600 / state.cycle);
  }

  // ── 投入間隔ステッパー ──
  window.adjCycle = function(d) {
    state.cycle = Math.max(1, Math.min(120, state.cycle + d));
    document.getElementById('cycle-val').textContent = state.cycle;
    calcProduction();
    saveState();
  };

  // ── 音（Web Audio API） ──
  let audioCtx = null;
  let compressor = null;
  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // DynamicsCompressorNodeで音圧を底上げし、鋭く大きく聞こえるようにする
      compressor = audioCtx.createDynamicsCompressor();
      const t0 = audioCtx.currentTime;
      compressor.threshold.setValueAtTime(-30, t0);
      compressor.knee.setValueAtTime(6, t0);
      compressor.ratio.setValueAtTime(16, t0);
      compressor.attack.setValueAtTime(0.001, t0);
      compressor.release.setValueAtTime(0.15, t0);
      compressor.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, opts = {}) {
    try {
      const ctx = ensureAudioCtx();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = opts.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (opts.freqEnd) osc.frequency.exponentialRampToValueAtTime(opts.freqEnd, t + duration);
      const peak = opts.peak ?? 1.0;
      const attack = opts.attack ?? 0.003;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(peak, t + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain).connect(compressor);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    } catch(e) {}
  }

  const SOUNDS = {
    pip:    { label: 'ピッ（短い高音）',       play: () => playTone(1300, 0.11, { type: 'square',   peak: 1.0, attack: 0.002 }) },
    poon:   { label: 'ポーン（柔らかい中音）', play: () => playTone(700,  0.30, { type: 'triangle', peak: 0.95, attack: 0.03 }) },
    pipip:  { label: 'ピピッ（2回短音）',       play: () => {
                playTone(1200, 0.07, { type: 'sawtooth', peak: 1.0, attack: 0.002 });
                setTimeout(() => playTone(1200, 0.07, { type: 'sawtooth', peak: 1.0, attack: 0.002 }), 100);
              } },
    don:    { label: '低めのドン（低音）',      play: () => playTone(130, 0.17, { type: 'square', peak: 1.0, attack: 0.002, freqEnd: 75 }) },
    denshi: { label: '電子音（電子的なビープ）', play: () => playTone(950, 0.09, { type: 'sawtooth', peak: 0.95, attack: 0.001 }) },
  };

  function playSound() {
    (SOUNDS[state.soundType] || SOUNDS.pip).play();
  }

  window.selectSound = function(key) {
    if (!SOUNDS[key]) return;
    state.soundType = key;
    saveState();
    renderSoundOptions();
    SOUNDS[key].play();
  };

  function renderSoundOptions() {
    const list = document.getElementById('sound-list');
    list.innerHTML = Object.entries(SOUNDS).map(([key, s]) => `
      <div class="sound-option${state.soundType === key ? ' selected' : ''}" onclick="selectSound('${key}')">
        <span class="so-label">${s.label}</span>
        <span class="so-radio"></span>
      </div>`).join('');
  }

  // ── 画面スリープ防止 ──
  let wakeLock = null;
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  function releaseWakeLock() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (metro.running && document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });

  // ── メトロノーム本体 ──
  const metro = { running: false, timerId: null, actualCount: 0, startedAtMs: 0, startedAtDate: null };

  function pulse() {
    const hero = document.getElementById('metro-hero');
    hero.classList.remove('pulse');
    void hero.offsetWidth;
    hero.classList.add('pulse');
  }

  function tick() {
    if (!metro.running) return;
    playSound();
    pulse();
    metro.actualCount++;
  }

  function startMetro() {
    const h = parseFloat(state.specHeight), w = parseFloat(state.specWidth),
          t = parseFloat(state.specThickness), c = parseFloat(state.specCount);
    if (!(h > 0) || !(w > 0) || !(t > 0) || !(c > 0)) {
      alert('本の仕様（縦・横・厚み・冊数）をすべて入力してください');
      return;
    }
    metro.running = true;
    metro.actualCount = 0;
    metro.startedAtMs = Date.now();
    metro.startedAtDate = new Date();
    document.getElementById('cycle-stepper').classList.add('disabled');
    setSpecDisabled(true);
    document.getElementById('metro-status').textContent = '稼働中';
    requestWakeLock();
    tick();
    metro.timerId = setInterval(tick, state.cycle * 1000);
  }

  async function stopMetro() {
    if (!metro.running) return;
    metro.running = false;
    clearInterval(metro.timerId);
    releaseWakeLock();
    document.getElementById('cycle-stepper').classList.remove('disabled');
    setSpecDisabled(false);
    document.getElementById('metro-status').textContent = '待機中';

    const elapsedSec = Math.round((Date.now() - metro.startedAtMs) / 1000);
    const record = {
      specHeight: parseFloat(state.specHeight),
      specWidth: parseFloat(state.specWidth),
      specThickness: parseFloat(state.specThickness),
      specCount: parseFloat(state.specCount),
      cycleSec: state.cycle,
      theoreticalPerHour: Math.round(3600 / state.cycle),
      actualCount: metro.actualCount,
      elapsedSec: elapsedSec,
      startedAt: metro.startedAtDate,
      stoppedAt: new Date(),
    };
    try {
      await addDoc(collection(db, 'seihon_records'), record);
    } catch (e) {
      alert('記録の保存に失敗しました（オフラインの場合は接続復帰後に自動保存されます）: ' + e.message);
    }
  }

  window.toggleMetro = function() {
    const btn = document.getElementById('toggle-btn');
    if (metro.running) {
      stopMetro();
      btn.textContent = 'スタート';
      btn.classList.remove('stop');
      btn.classList.add('start');
    } else {
      startMetro();
      if (metro.running) {
        btn.textContent = 'ストップ';
        btn.classList.remove('start');
        btn.classList.add('stop');
      }
    }
  };

  // ══════════ 履歴タブ ══════════
  let historyView = 'date';
  let allRecords = [];

  window.switchHistoryView = function(v) {
    historyView = v;
    document.getElementById('view-btn-date').classList.toggle('active', v === 'date');
    document.getElementById('view-btn-spec').classList.toggle('active', v === 'spec');
    renderHistory();
  };

  function toDate(ts) {
    if (!ts) return new Date();
    return ts.toDate ? ts.toDate() : new Date(ts);
  }
  function fmtDate(d) {
    return d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
  }
  function fmtTime(d) {
    return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDuration(sec) {
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m > 0 ? `${m}分${s}秒` : `${s}秒`;
  }
  function specKey(r) {
    return `${r.specHeight}×${r.specWidth}×${r.specThickness}mm`;
  }
  function actualPace(r) {
    return r.actualCount > 0 ? (r.elapsedSec / r.actualCount).toFixed(1) : '—';
  }

  function recordCard(r, showSpec) {
    const d = toDate(r.startedAt);
    return `
      <div class="rec-card">
        <div class="rec-top">
          <span class="rec-time">${fmtTime(d)}</span>
          <span class="rec-date">${fmtDate(d)}</span>
        </div>
        ${showSpec ? `<div class="rec-spec">${specKey(r)} ／ ${r.specCount}冊</div>` : ''}
        <div class="rec-grid">
          <div class="rec-item">投入間隔 <b>${r.cycleSec}秒</b></div>
          <div class="rec-item">理論生産数 <b>${r.theoreticalPerHour}冊/h</b></div>
          <div class="rec-item">実績冊数 <b>${r.actualCount}冊</b></div>
          <div class="rec-item">計測時間 <b>${fmtDuration(r.elapsedSec)}</b></div>
          <div class="rec-item">実績ペース <b>${actualPace(r)}秒/冊</b></div>
        </div>
      </div>`;
  }

  function renderHistory() {
    const container = document.getElementById('history-container');
    if (allRecords.length === 0) {
      container.innerHTML = '<div class="empty-state">まだ記録がありません</div>';
      return;
    }

    if (historyView === 'date') {
      const groups = new Map();
      allRecords.forEach(r => {
        const key = fmtDate(toDate(r.startedAt));
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      });
      let html = '';
      groups.forEach((recs, dateLabel) => {
        html += `<div class="group-head">${dateLabel}<div class="group-sub">${recs.length}件</div></div>`;
        recs.forEach(r => { html += recordCard(r, true); });
      });
      container.innerHTML = html;
    } else {
      const groups = new Map();
      allRecords.forEach(r => {
        const key = specKey(r);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      });
      let html = '';
      groups.forEach((recs, spec) => {
        const paces = recs.map(r => r.actualCount > 0 ? r.elapsedSec / r.actualCount : null).filter(v => v !== null);
        const avg = paces.length ? (paces.reduce((a,b) => a+b, 0) / paces.length).toFixed(1) : '—';
        html += `<div class="group-head">${spec}<div class="group-sub">${recs.length}件・平均実績ペース ${avg}秒/冊</div></div>`;
        recs.forEach(r => { html += recordCard(r, false); });
      });
      container.innerHTML = html;
    }
  }

  function subscribeHistory() {
    const q = query(collection(db, 'seihon_records'), orderBy('startedAt', 'desc'), limit(300));
    onSnapshot(q, snap => {
      allRecords = snap.docs.map(d => d.data());
      renderHistory();
    }, err => {
      document.getElementById('history-container').innerHTML =
        `<div class="empty-state">履歴の読み込みに失敗しました<br>${err.message}</div>`;
    });
  }

  // ── 画面反映（復元後） ──
  function syncUI() {
    document.getElementById('cycle-val').textContent = state.cycle;
    calcProduction();
    syncSpecInputs();
    renderSizePresets();
    renderSoundOptions();
  }

  // ── Service Worker 登録 ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // ── 起動 ──
  loadState();
  syncUI();
  checkInstall();
  subscribeHistory();
</script>
</body>
</html>
